<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Tecnico - Jeronimo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="src/tailwind.js"></script>
</head>

<body class="bg-ink text-slate-200 font-mono min-h-screen">

    <div class="max-w-2xl mx-auto px-5 py-12">

        <!-- Header -->
        <header class="mb-8 border-b border-line pb-6">
            <h1 class="text-2xl text-slate-50 font-semibold">Buscador de productos y pedidos</h1>
            <p class="text-slate-400 text-sm mt-2">Selecciona una categoría, envía el valor y recibe el resultado del
                endpoint.</p>
        </header>

        <!-- Panel de formulario -->
        <section class="bg-panel border border-line rounded-lg p-5">

            <label class="block text-ms uppercase tracking-wide text-slate-400 mb-2" for="categoria">Categoría</label>
            <select id="categoria"
                class="w-full bg-ink border border-line rounded-md px-3 py-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-accent/60">
                <option value="">— selecciona —</option>
                <option value="productos">productos</option>
                <option value="pedidos">pedidos</option>
            </select>

            <!-- Bloque productos -->
            <div id="bloque-productos" class="hidden mt-4">
                <label class="block text-sm uppercase tracking-wide text-slate-400 mb-2" for="target_value">Dato del
                    producto a buscar</label>
                <input type="text" id="target_value" placeholder="ej. Panel Redondo"
                    class="w-full bg-ink border border-line rounded-md px-3 py-2.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-accent/60">
            </div>

            <!-- Bloque pedidos -->
            <div id="bloque-pedidos" class="hidden mt-4">
                <label class="block text-sm uppercase tracking-wide text-slate-400 mb-2" for="cliente">Cliente</label>
                <select id="cliente"
                    class="w-full bg-ink border border-line rounded-md px-3 py-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-accent/60">
                    <option value="">cargando clientes...</option>
                </select>
            </div>

            <button id="btn-consultar"
                class="mt-5 w-full bg-accent text-ink font-semibold rounded-md py-2.5 hover:bg-teal-500 active:scale-[0.99] transition">
                Consultar
            </button>

        </section>

        <!-- Resultado -->
        <section class="mt-6">
            <p class="text-sm uppercase tracking-wide text-slate-500 mb-2">Respuesta</p>
            <pre id="resultado"
                class="bg-panel border border-line rounded-lg p-4 text-sm text-slate-300 min-h-[3rem] whitespace-pre-wrap break-words">— sin consultas aún —</pre>
        </section>

    </div>


    <script src="src/main.js"></script>
</body>

</html>
